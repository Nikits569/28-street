{% extends 'head.html' %}
{% load static %}

{% block gallerea %}
<link type="text/css" href="{% static 'project/css/gallery.css' %}" rel="stylesheet" />

<div id="galleryPage">
    {% for i in gallery %}
        <h1 class="galleryTitle">{{ i.title }}</h1>

        <div class="masonry">
            {% for image in i.images.all %}
                <div class="item {% cycle '' 'big' 'tall' 'wide' %}">
                    <img src="{{ image.image.url }}"
                        loading="lazy"
                        alt="{{ image.alt_text }}">
                    <span class="zoom-hint">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.3" y1="16.3" x2="21" y2="21"/></svg>
                    </span>
                </div>
            {% endfor %}
        </div>
    {% endfor %}
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {

    const overlay = document.createElement('div');
    overlay.id = 'image-overlay';

    overlay.innerHTML = `
        <span id="close-overlay">&times;</span>
        <button id="overlay-prev" class="overlay-nav" aria-label="Попереднє фото">‹</button>
        <img id="overlay-image" src="" alt="">
        <button id="overlay-next" class="overlay-nav" aria-label="Наступне фото">›</button>
        <span id="overlay-counter"></span>
    `;

    document.body.appendChild(overlay);

    const overlayImage = document.getElementById('overlay-image');
    const overlayCounter = document.getElementById('overlay-counter');
    const images = Array.from(document.querySelectorAll('.masonry img'));
    let currentIndex = 0;

    function showImage(index){
        currentIndex = (index + images.length) % images.length;
        overlayImage.src = images[currentIndex].src;
        overlayCounter.textContent = `${currentIndex + 1} / ${images.length}`;
    }

    images.forEach((img, index) => {
        img.addEventListener('click', function () {
            showImage(index);
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        });
    });

    document.getElementById('overlay-prev').addEventListener('click', (e) => {
        e.stopPropagation();
        showImage(currentIndex - 1);
    });

    document.getElementById('overlay-next').addEventListener('click', (e) => {
        e.stopPropagation();
        showImage(currentIndex + 1);
    });

    document.getElementById('close-overlay').addEventListener('click', closeOverlay);

    overlay.addEventListener('click', function (e) {
        if (e.target === overlay) {
            closeOverlay();
        }
    });

    document.addEventListener('keydown', function (e) {
        if (!overlay.classList.contains('active')) return;
        if (e.key === 'Escape') closeOverlay();
        if (e.key === 'ArrowLeft') showImage(currentIndex - 1);
        if (e.key === 'ArrowRight') showImage(currentIndex + 1);
    });

    function closeOverlay() {
        overlay.classList.remove('active');
        overlayImage.src = '';
        document.body.style.overflow = '';
    }

    /* Плавна поява плиток при скролі */

    const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                revealObserver.unobserve(entry.target);
            }
        });
    }, { threshold: 0.1 });

    document.querySelectorAll('.masonry .item').forEach(item => revealObserver.observe(item));
});
</script>
{% endblock %}
